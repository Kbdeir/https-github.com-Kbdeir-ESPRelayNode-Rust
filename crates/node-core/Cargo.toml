[package]
name = "node-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
form_urlencoded = "1"
base64 = "0.22"
rmodbus = "=0.12.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
struson = "=0.7.2"

[dev-dependencies]
anyhow = "1"
log = "0.4"
tiny_http = "0.12"
getrandom = "0.2"
