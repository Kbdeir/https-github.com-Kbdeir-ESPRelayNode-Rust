name: ESP32 Rust firmware build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build original ESP32 (Xtensa)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ESP-IDF Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl pkg-config libssl-dev \
            python3 python3-pip python3-venv cmake ninja-build flex bison \
            gperf ccache libffi-dev libusb-1.0-0

      - name: Install Rust and Espressif toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install espup --locked
          espup install
          source "$HOME/export-esp.sh"
          cargo +stable install ldproxy --locked
          cargo +stable install espflash --locked

      - name: Build firmware
        shell: bash
        run: |
          source "$HOME/export-esp.sh"
          cargo +esp build --release -Zbuild-std=std,panic_abort

      - name: Produce flashable binary
        shell: bash
        run: |
          source "$HOME/export-esp.sh"
          mkdir -p dist
          bootloader=$(find target/xtensa-esp32-espidf/release/build -path '*/out/build/bootloader/bootloader.bin' -print -quit)
          test -n "$bootloader"
          espflash save-image --chip esp32 --merge \
            --bootloader "$bootloader" --target-app-partition ota_0 \
            --partition-table partitions.csv \
            target/xtensa-esp32-espidf/release/esp-relay-node-rust \
            dist/esp-relay-node-rust-esp32.bin
          espflash save-image --chip esp32 --partition-table partitions.csv \
            --bootloader "$bootloader" --target-app-partition ota_0 \
            target/xtensa-esp32-espidf/release/esp-relay-node-rust dist/application-ota.bin
          python3 -m pip install 'littlefs-python==0.19.0'
          fs_size=$(python3 -c "import csv; print(int(next(row for row in csv.reader(line for line in open('partitions.csv') if not line.startswith('#')) if row[0].strip() == 'littlefs')[4], 0))")
          littlefs-python create web dist/littlefs.bin --fs-size="$fs_size" --block-size=4096 --name-max=255
          python3 tools/verify-filesystem.py dist/littlefs.bin web partitions.csv
          cp partitions.csv dist/partitions.csv

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-relay-node-rust-esp32
          path: dist/*
          if-no-files-found: error
          retention-days: 14
